version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
      - ./config:/app/config:ro
      - recordings:/recordings
    env_file: .env
    environment:
      - ASTERISK_HOST=asterisk
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn[standard] sqlalchemy psycopg2-binary pydantic aiogram httpx pyyaml alembic pytz redis && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - db
      - redis
      - asterisk

  worker:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    env_file: .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: bash -lc "pip install --no-cache-dir redis rq && python -c 'print("worker stub")'"
    depends_on:
      - api
      - redis

  asterisk:
    build:
      context: .
      dockerfile: Dockerfile.asterisk
    ports:
      - "5060:5060/udp"
      - "5038:5038/tcp"
      - "10000-10100:10000-10100/udp"
    volumes:
      - ./asterisk-config:/etc/asterisk:ro
      - recordings:/recordings
    environment:
      - ASTERISK_HOST=asterisk
      - ASTERISK_PORT=5038
      - ASTERISK_USERNAME=admin
      - ASTERISK_PASSWORD=amp111
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data: {}
  redis_data: {}
  recordings: {}
