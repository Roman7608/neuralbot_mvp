; ===================================================================
; PJSIP configuration for Vikingi Voice Bot
; Asterisk registers on Infolada Asterisk as a SIP client,
; receives calls on DID 707755 and routes to AudioSocket voice-bot.
; ===================================================================

; --- Transport ---

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; --- Auth for registration on Infolada ---

[infolada-auth]
type=auth
auth_type=userpass
username=${INFOLADA_SIP_USER}
password=${INFOLADA_SIP_PASSWORD}

; --- Registration on Infolada Asterisk ---

[infolada-reg]
type=registration
transport=transport-udp
outbound_auth=infolada-auth
server_uri=sip:${INFOLADA_SIP_HOST}:${INFOLADA_SIP_PORT}
client_uri=sip:${INFOLADA_SIP_USER}@${INFOLADA_SIP_HOST}:${INFOLADA_SIP_PORT}
retry_interval=60
line=yes
endpoint=infolada

; --- Endpoint for calls from Infolada ---

[infolada]
type=endpoint
context=from-infolada
transport=transport-udp
; Исходящие (перевод Dial): From должен совпадать с учёткой digest, иначе 401/отказ при INVITE.
from_user=${INFOLADA_SIP_USER}
from_domain=${INFOLADA_SIP_HOST}
; Явно отправляем identity заголовки для корректной передачи ANI/Caller-ID.
send_pai=yes
send_rpid=yes
disallow=all
allow=alaw
allow=ulaw
outbound_auth=infolada-auth
aors=infolada
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[infolada]
type=aor
contact=sip:${INFOLADA_SIP_HOST}:${INFOLADA_SIP_PORT}
qualify_frequency=60

; --- Identify incoming from Infolada by IP ---

[infolada-identify]
type=identify
endpoint=infolada
match=${INFOLADA_SIP_HOST}
