; ===================================================================
; Dialplan for Vikingi Voice Bot
; ===================================================================

[general]
static=yes
writeprotect=no

; --- Incoming calls from Infolada ---

[from-infolada]
; All incoming calls → AudioSocket to voice-bot container
; Extension 's' — когда Infolada шлёт вызов без номера в Request-URI
exten => s,1,NoOp(Incoming call: ${CALLERID(num)} -> ${EXTEN}, UUID: ${CHANNEL(uniqueid)})
 same => n,Answer()
 ; До AudioSocket: фиксируем ANI звонящего (для PAI/E1 при переводе; From остаётся SIP-учётка).
 same => n,Set(__ORIG_ANI=${CALLERID(num)})
 ; Входящий DID: пытаемся взять оригинальный номер из SIP-заголовков, при любом сбое fallback = EXTEN.
 ; Это безопасно для маршрутизации: влияет только на аналитическое поле incoming_did.
 same => n,Set(__IN_DID=${FILTER(0-9,${PJSIP_HEADER(read,P-Called-Party-ID)})})
 same => n,ExecIf($["${IN_DID}"=""]?Set(__IN_DID=${FILTER(0-9,${PJSIP_HEADER(read,Diversion)})}))
 same => n,ExecIf($["${IN_DID}"=""]?Set(__IN_DID=${FILTER(0-9,${PJSIP_HEADER(read,X-Original-DID)})}))
 same => n,ExecIf($["${IN_DID}"=""]?Set(__IN_DID=${FILTER(0-9,${PJSIP_HEADER(read,To)})}))
 same => n,ExecIf($[${LEN(${IN_DID})} < 5]?Set(__IN_DID=${FILTER(0-9,${EXTEN})}))
 same => n,ExecIf($[${LEN(${IN_DID})} > 8]?Set(__IN_DID=${FILTER(0-9,${EXTEN})}))
 same => n,NoOp(Resolved incoming DID: IN_DID=${IN_DID}, EXTEN=${EXTEN})
 same => n,Wait(0.5)
 same => n,Set(call_uuid_tail=000000000000${FILTER(0-9,${CHANNEL(uniqueid)})})
 same => n,Set(call_uuid=00000000-0000-4000-8000-${call_uuid_tail:-12})
 ; Ключ AstDB = 32 hex без дефисов (совпадает с первым фреймом AudioSocket: 16 байт → p.hex() на боте).
 same => n,Set(UUID_KEY=${FILTER(0-9a-fA-F,${call_uuid})})
 same => n,Set(DB(vikingi_xfer/${UUID_KEY})="${CHANNEL(name)}")
 ; ANI для голосового бота (лиды / нерабочее время): AMI DBGet vikingi_ani/<UUID_KEY>
 same => n,Set(DB(vikingi_ani/${UUID_KEY})=${ORIG_ANI})
 ; DID для голосового бота (входящий номер): AMI DBGet vikingi_did/<UUID_KEY>
 same => n,Set(DB(vikingi_did/${UUID_KEY})=${IN_DID})
 ; Единый сценарий бота: все DID → один порт 9092 (docs/VOICE_BOT_UNIFIED_SCENARIO.txt)
 same => n,AudioSocket(${call_uuid},voice-bot:9092)
 same => n,Hangup()
exten => _X.,1,NoOp(Incoming call: ${CALLERID(num)} -> ${EXTEN}, UUID: ${CHANNEL(uniqueid)})
 same => n,Answer()
 same => n,Set(__ORIG_ANI=${CALLERID(num)})
 same => n,Set(__IN_DID=${FILTER(0-9,${PJSIP_HEADER(read,P-Called-Party-ID)})})
 same => n,ExecIf($["${IN_DID}"=""]?Set(__IN_DID=${FILTER(0-9,${PJSIP_HEADER(read,Diversion)})}))
 same => n,ExecIf($["${IN_DID}"=""]?Set(__IN_DID=${FILTER(0-9,${PJSIP_HEADER(read,X-Original-DID)})}))
 same => n,ExecIf($["${IN_DID}"=""]?Set(__IN_DID=${FILTER(0-9,${PJSIP_HEADER(read,To)})}))
 same => n,ExecIf($[${LEN(${IN_DID})} < 5]?Set(__IN_DID=${FILTER(0-9,${EXTEN})}))
 same => n,ExecIf($[${LEN(${IN_DID})} > 8]?Set(__IN_DID=${FILTER(0-9,${EXTEN})}))
 same => n,NoOp(Resolved incoming DID: IN_DID=${IN_DID}, EXTEN=${EXTEN})
 same => n,Wait(0.5)
 same => n,Set(call_uuid_tail=000000000000${FILTER(0-9,${CHANNEL(uniqueid)})})
 same => n,Set(call_uuid=00000000-0000-4000-8000-${call_uuid_tail:-12})
 same => n,Set(UUID_KEY=${FILTER(0-9a-fA-F,${call_uuid})})
 same => n,Set(DB(vikingi_xfer/${UUID_KEY})="${CHANNEL(name)}")
 same => n,Set(DB(vikingi_ani/${UUID_KEY})=${ORIG_ANI})
 same => n,Set(DB(vikingi_did/${UUID_KEY})=${IN_DID})
 same => n,AudioSocket(${call_uuid},voice-bot:9092)
 same => n,Hangup()

; --- Transfer context (called by AMI Redirect or SIP REFER) ---

[transfer-to-operator]
exten => _X.,1,NoOp(Transferring to operator: ${EXTEN})
 same => n,Set(CALLERID(num)=${ORIG_ANI})
 same => n,Dial(PJSIP/${EXTEN}@infolada,30)
 same => n,Hangup()
