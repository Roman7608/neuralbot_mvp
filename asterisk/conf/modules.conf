; Only load what we need

[modules]
autoload=yes

; AudioSocket support
load = app_audiosocket.so
load = res_audiosocket.so
; Set(DB(...)) — func_db (в menuselect по умолчанию). Приложение Database() не используем — не входит в образ.
load = func_db.so

; Disable unused heavy modules
noload = chan_iax2.so
noload = chan_mgcp.so
noload = chan_skinny.so
noload = chan_unistim.so
noload = res_adsi.so
noload = res_smdi.so
noload = cdr_mysql.so
noload = cdr_pgsql.so
noload = cdr_sqlite3_custom.so
noload = cel_pgsql.so
noload = cel_sqlite3_custom.so
noload = res_config_mysql.so
noload = res_config_pgsql.so
