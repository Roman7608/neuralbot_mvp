[general]
static=yes
writeprotect=no

[globals]

[from-pstn]
; Входящие звонки из внешней сети
exten => s,1,NoOp(Входящий звонок от ${CALLERID(num)})
exten => s,n,Set(CALLERID(name)=Звонящий ${CALLERID(num)})
exten => s,n,Answer()
exten => s,n,Wait(1)
exten => s,n,Playback(hello-world)
exten => s,n,Hangup()

[from-internal]
; Внутренние звонки
exten => 001,1,NoOp(Звонок в отдел продаж Chery)
exten => 001,n,Answer()
exten => 001,n,Wait(1)
exten => 001,n,Set(CALLFILENAME=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)})
exten => 001,n,MixMonitor(${CALLFILENAME}.wav,b)
exten => 001,n,Set(VOICE_BOT_URL=http://api:8000/internal/bot/voice/call)
exten => 001,n,Set(VOICE_BOT_MESSAGE=Здравствуйте! Вы позвонили в отдел продаж Chery. Чем могу помочь?)
exten => 001,n,Playback(hello-world)
exten => 001,n,Wait(2)
exten => 001,n,Playback(hello-world)
exten => 001,n,Wait(1)
exten => 001,n,Hangup()

exten => 002,1,NoOp(Звонок в отдел продаж Jetour)
exten => 002,n,Answer()
exten => 002,n,Playback(hello-world)
exten => 002,n,Hangup()

exten => 100,1,NoOp(Консультант fallback)
exten => 100,n,Answer()
exten => 100,n,Playback(hello-world)
exten => 100,n,Hangup()

[test-calls]
; Тестовые звонки
exten => 999,1,NoOp(Тестовый звонок)
exten => 999,n,Answer()
exten => 999,n,Playback(hello-world)
exten => 999,n,Hangup()













